[workspace]
members = [
    "networking",
    "consensus",
    "beacon-chain",
    "messaging",
    "orderflow",
    "crates/engine-sync",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
proptest = "1.5"
alloy-primitives = { version = "0.8", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
aya = "0.12"
revm = "14.0"
